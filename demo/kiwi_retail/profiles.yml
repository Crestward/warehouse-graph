# Local profile (PRD §6.2). Reads the same POSTGRES_* variables as docker-compose.yml.
kiwi_retail:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'warehouse') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'local-dev-only') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'warehouse') }}"
      schema: marts
      threads: 4
    # databricks-dev profile (PRD §6.2): `warehouse-graph demo-build --target databricks`
    databricks:
      type: databricks
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'kiwi') }}"
      host: "{{ env_var('DBT_DATABRICKS_HOST', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      schema: marts
      threads: 4
