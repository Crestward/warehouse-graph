version: 2

sources:
  - name: shop
    description: >
      Kiwi Retail's commerce platform (POS for physical stores + the online shop), replicated
      nightly into the `raw` schema. Amounts are in the store's local currency (NZD or AUD).
    schema: raw
    config:
      loaded_at_field: _loaded_at
      meta: {owner: "data-platform@kiwiretail.example", loader: "commerce-replicator"}
    tables:
      - name: customers
        description: One row per registered customer. Contains PII (email, phone).
      - name: orders
        description: One row per order header, all channels.
        config:
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
      - name: order_items
        description: One row per order line.
      - name: payments
        description: >
          One row per payment attempt. An order can have several rows: failed attempts and
          split tenders (gift card + card).
        config:
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
      - name: refunds
        description: >
          One row per refund. Only refunds processed on the new POS (from 2024-03-01) exist here.
      - name: products
        description: Product catalogue with NZD list prices and unit costs.
      - name: stores
        description: Physical stores and the two online storefronts (one per country).
