[project]
name = "warehouse-graph"
version = "0.1.0"
description = "Shared metadata/lineage graph, warehouse adapters, policy-as-code and MCP server for warehouse-qa and pipeline-sentinel."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1,<3",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
]

[project.scripts]
warehouse-graph = "warehouse_graph.cli:main"

[dependency-groups]
demo = [
    "dagster>=1.13.26",
    "dagster-dbt>=0.29.26",
    "dagster-webserver>=1.13.26",
    "dbt-core>=1.10",
    "dbt-postgres>=1.9",
]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
default-groups = ["dev", "demo"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse_graph"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs local Postgres with the demo warehouse built (make warehouse)",
]
