[project]
name = "warehouse-graph"
version = "0.1.0"
description = "Shared metadata/lineage graph, warehouse adapters, policy-as-code and MCP server for warehouse-qa and pipeline-sentinel."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1,<3",
    "jsonschema>=4.23",
    "mcp>=1.20",
    "networkx>=3.4",
    "numpy>=2.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pyyaml>=6",
    "sentence-transformers>=5",
    "sqlglot>=27",
    "torch>=2.6",
]

[project.scripts]
warehouse-graph = "warehouse_graph.cli:main"

[dependency-groups]
demo = [
    "dagster>=1.13.26",
    "dagster-dbt>=0.29.26",
    "dagster-webserver>=1.13.26",
    "dbt-core>=1.10",
    "dbt-postgres>=1.9",
]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-jsonschema>=4.26.0.20261006",
    "types-networkx>=3.6.1.20261024",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
default-groups = ["dev", "demo"]

# CPU-only torch for the local embedding model: the default Linux wheels pull in CUDA (GBs).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse_graph"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs local Postgres with the demo warehouse built (make warehouse)",
]
filterwarnings = [
    # sqlglot[rs] comes in through dagster-dbt/metricflow (demo group), not from our code.
    "ignore:sqlglotrs is deprecated:DeprecationWarning",
]
